<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Static light-mode links ensure T3 and browsers always detect a favicon. -->
    <link id="theme-favicon" rel="icon" type="image/png" sizes="512x512" href="/favicon-light.png?v=5" />
    <link id="theme-favicon-ico" rel="icon" type="image/x-icon" href="/favicon-light.ico?v=5" />
    <link id="theme-favicon-32" rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32x32.png?v=5" />
    <link id="theme-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-light.png?v=5" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem('shahsnutrition_theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        const prefix = theme === 'light' ? 'light' : 'dark';
        const version = '?v=5';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-favicon').setAttribute('href', '/favicon-' + prefix + '.png' + version);
        document.getElementById('theme-favicon-ico').setAttribute('href', '/favicon-' + prefix + '.ico' + version);
        document.getElementById('theme-favicon-32').setAttribute('href', '/favicon-' + prefix + '-32x32.png' + version);
        document.getElementById('theme-apple-touch-icon').setAttribute('href', '/apple-touch-icon-' + prefix + '.png' + version);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shah's Nutrition — Real Nutrition. Real Ingredients. Real Good.</title>
    <meta
      name="description"
      content="Natural, high quality nutrition available and affordable to everyone. Starting with Protein Chivda, Muesli, and Protein Bars."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shah's Nutrition — Real Nutrition. Real Ingredients. Real Good." />
    <meta property="og:description" content="Natural, high quality nutrition available and affordable to everyone. Protein Chivda, Muesli, and Protein Bars." />
    <meta property="og:image" content="/assets/hero-composition.png" />
    <meta property="og:url" content="https://shahsnutrition.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shah's Nutrition" />
    <meta name="twitter:description" content="Natural, high quality nutrition for everyone." />
    <meta name="twitter:image" content="/assets/hero-composition.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#d4af37" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Shah's Nutrition",
      "url": "https://shahsnutrition.com",
      "logo": "/assets/logo.png",
      "description": "Natural, high quality nutrition available and affordable to everyone.",
      "sameAs": ["https://instagram.com/shahsnutrition"]
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
