<!DOCTYPE html>
<html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Before the theme script: the hero preload picks its srcset size from the viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static light-mode links ensure T3 and browsers always detect a favicon. -->
    <link id="theme-favicon" rel="icon" type="image/png" sizes="512x512" href="/favicon-light.png?v=5" />
    <link id="theme-favicon-ico" rel="icon" type="image/x-icon" href="/favicon-light.ico?v=5" />
    <link id="theme-favicon-32" rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32x32.png?v=5" />
    <link id="theme-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-light.png?v=5" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Browser toolbar colour follows the page background. The script below (and
         ThemeContext) points both at the chosen theme when someone overrides the OS. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef4fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f" />
    <script>
      (function () {
        // Blocked site storage throws here. Fall back to the OS setting instead of stopping.
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('shahsnutrition_theme'); } catch (e) {}
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        const prefix = theme === 'light' ? 'light' : 'dark';
        const version = '?v=5';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-favicon').setAttribute('href', '/favicon-' + prefix + '.png' + version);
        document.getElementById('theme-favicon-ico').setAttribute('href', '/favicon-' + prefix + '.ico' + version);
        document.getElementById('theme-favicon-32').setAttribute('href', '/favicon-' + prefix + '-32x32.png' + version);
        document.getElementById('theme-apple-touch-icon').setAttribute('href', '/apple-touch-icon-' + prefix + '.png' + version);
        // The hero art is the LCP. Start it now instead of after the JS bundle runs.
        // Must match the srcSet/sizes in HeroSection.tsx, or it downloads twice.
        const hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.setAttribute('fetchpriority', 'high');
        const heroBase = '/assets/generated-muesli/muesli-hero-accurate-v2-' + prefix;
        hero.href = heroBase + '.webp';
        hero.setAttribute('imagesrcset', heroBase + '-828w.webp 828w, ' + heroBase + '-1242w.webp 1242w, ' + heroBase + '.webp 1672w');
        hero.setAttribute('imagesizes', '100vw');
        document.head.appendChild(hero);
        const toolbar = theme === 'light' ? '#eef4fc' : '#1f1f1f';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) { meta.setAttribute('content', toolbar); });
      })();
    </script>
    <title>Shah's Nutrition — Simple Ingredients, Extraordinary Benefits</title>
    <link rel="canonical" href="https://www.shahsnutrition.food/" />
    <meta
      name="description"
      content="Raggi Jaggi, Muesli and Date Bites from Shah's Nutrition: wholesome everyday foods made with real ingredients and honest nutrition. Order on WhatsApp."
    />

    <!-- Open Graph. Scrapers (WhatsApp, Facebook) need absolute URLs. The card is
         1200x630 and under 200 KB; a changed card needs a new file name. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shah's Nutrition" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Shah's Nutrition — Simple Ingredients, Extraordinary Benefits" />
    <meta property="og:description" content="Meet Raggi Jaggi, Muesli and Date Bites. Real ingredients, honest nutrition, made fresh in small batches. Order on WhatsApp." />
    <meta property="og:url" content="https://www.shahsnutrition.food/" />
    <meta property="og:image" content="https://www.shahsnutrition.food/og/shahs-nutrition-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pack of Shah's Nutrition Muesli beside a bowl of muesli, with the words &quot;Simple ingredients. Extraordinary benefits.&quot; and the range: Raggi Jaggi, Muesli, Date Bites." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shah's Nutrition" />
    <meta name="twitter:description" content="Raggi Jaggi, Muesli and Date Bites. Simple ingredients, extraordinary benefits. Order on WhatsApp." />
    <meta name="twitter:image" content="https://www.shahsnutrition.food/og/shahs-nutrition-v2.jpg" />
    <meta name="twitter:image:alt" content="A pack of Shah's Nutrition Muesli beside a bowl of muesli, with the words &quot;Simple ingredients. Extraordinary benefits.&quot; and the range: Raggi Jaggi, Muesli, Date Bites." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.shahsnutrition.food/#organization",
          "name": "Shah's Nutrition",
          "url": "https://www.shahsnutrition.food/",
          "logo": "https://www.shahsnutrition.food/assets/logo-v2.png",
          "description": "Wholesome everyday foods made with real ingredients and honest nutrition: Raggi Jaggi, Muesli and Date Bites.",
          "contactPoint": [
            { "@type": "ContactPoint", "contactType": "sales", "telephone": "+91-9850359899", "areaServed": "IN" },
            { "@type": "ContactPoint", "contactType": "customer service", "telephone": "+91-9881191999", "areaServed": "IN" }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.shahsnutrition.food/#website",
          "name": "Shah's Nutrition",
          "url": "https://www.shahsnutrition.food/",
          "inLanguage": "en-IN",
          "publisher": { "@id": "https://www.shahsnutrition.food/#organization" }
        }
      ]
    }
    </script>

    <!-- Self-hosted fonts (@font-face in src/styles/tokens.css); both are used above the fold. -->
    <link rel="preload" href="/assets/fonts/inter-latin-v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/outfit-latin-v1.woff2" as="font" type="font/woff2" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
